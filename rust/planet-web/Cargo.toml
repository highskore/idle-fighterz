[package]
name = "planet-web"
description = "WebAssembly entry point: the HUD bridge to page.html (and, with stage 1, the canvas)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
planet-core = { path = "../planet-core" }
planet-render = { path = "../planet-render" }
# pinned to the wasm-bindgen CLI that build.sh runs: the two must match exactly
wasm-bindgen = "=0.2.129"

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Re-render the visual baselines and commit them to this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # px.wasm is committed and checked byte for byte, and clippy runs with -D warnings: both want a fixed compiler
  RUST_TOOLCHAIN: 1.98.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Site page
        run: node build.mjs && test -s dist/planet.html
      - name: Widget page
        run: node build.mjs --widget && test -s dist/index.html

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal -c rustfmt,clippy && rustup default $RUST_TOOLCHAIN
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests and the JS-vs-Rust difftest
        run: |
          cargo test -p planet-core --release --locked -- --nocapture 2>&1 | tee test.log
          # the difftest skips itself without node: make sure it ran, and diffed clean
          if grep 'skipping' test.log; then exit 1; fi
          grep -q ' 0 mismatches' test.log
          if grep -E '[1-9][0-9]* mismatches' test.log; then exit 1; fi

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal -t wasm32-unknown-unknown && rustup default $RUST_TOOLCHAIN
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            rust
            wasm
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-bindgen@0.2.129
      - name: px.wasm (committed) matches wasm/src
        run: sh wasm/build.sh && git diff --exit-code --stat wasm/px.wasm
      - name: planet-web
        run: sh rust/planet-web/build.sh
      - name: The --rust page
        run: node build.mjs --rust
      - name: The --rust page's game against the drawing
        run: node rust/planet-web/test.mjs

  hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        size: [desktop, phone]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser
      - name: Every preview hook, no page or console errors
        run: npx playwright test hooks --project ${{ matrix.size }}

  visual:
    if: ${{ !inputs.update_baselines }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser
      - name: Pixel baselines
        id: test
        run: npx playwright test visual
      - name: Upload the screenshots
        id: shots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: shots/
          if-no-files-found: error
      - name: Upload expected, actual and diff
        id: diffs
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: test-results/
      - name: Link them on the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.shots.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.test.outcome }}
          SHOTS: ${{ steps.shots.outputs.artifact-url }}
          DIFFS: ${{ steps.diffs.outputs.artifact-url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mark='<!-- planet-screenshots -->'
          if [ "$RESULT" = success ]; then verdict='match the baselines'; else verdict="**differ from the baselines** ([expected, actual and diff]($DIFFS))"; fi
          body="$mark
          **Screenshots** for ${SHA:0:7}: [every state, desktop and phone]($SHOTS). They $verdict. ([run]($RUN))"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$mark\")) | .id" | head -n1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null; fi

  baselines:
    if: ${{ inputs.update_baselines }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser
      - run: npx playwright test visual --update-snapshots=all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baselines
          path: test/browser/__screenshots__/
      - name: Commit them
        run: |
          git add test/browser/__screenshots__
          git diff --cached --quiet && { echo 'the baselines are unchanged'; exit 0; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(visual): re-render the pixel baselines'
          git push

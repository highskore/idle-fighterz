<style>
/* Layout: the pearl logo above a framed card holding the idle planet game, links in the footer. Light only. */
:root {
  --bg: #ffffff;
  --ink: #0b0b0b;
  --muted: #8d8d8d;
  --line: #ececec;
  --gold: #d99a1c;
  --sea: #e2a93a;   /* the deepest tone of the world's sea: gold clouds, or namek's water */
  --serif: "Instrument Serif", "Times New Roman", serif;
  --mono: "Fragment Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
/* a game you tap fast: no double-tap zoom, no text selection or callout loupe, no grey tap flash.
   manipulation keeps scrolling and pinch-zoom, it only drops the double-tap zoom delay */
html, body, .page, .game, .game *, .brand, .brand * { touch-action: manipulation; }
.game, .brand, .foot { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.5; letter-spacing: .01em; }
a { color: inherit; text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 3px; outline: none; }
.gutter { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

.game { position: relative; overflow: hidden; }
.stage { position: absolute; inset: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
#logo { display: block; width: 100%; height: 100%; touch-action: manipulation; }
/* desktop: the title canvas overhangs its box top and bottom, so letters shoved up or down while they jostle aren't cut off */
@media (min-width: 761px) { #logo { position: absolute; left: 0; top: -45%; height: 190%; pointer-events: auto; } }
#glint { position: absolute; left: 0; top: 0; image-rendering: pixelated; pointer-events: none; }
.brand { position: relative; transition: opacity .6s; }
/* phones: while the dragon is out the title drops behind the game canvas (its sky is transparent), so he flies over it */
@media (max-width: 760px) { body .game { background: transparent; } body .page { background: #fcfcfb; } body.shen .brand { z-index: 0; } body.shen .game { z-index: 1; } }
.tag { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); margin: 0; white-space: nowrap; color: var(--muted); text-transform: lowercase; letter-spacing: .02em; pointer-events: none; }
.tag .t { display: inline-block; overflow: hidden; vertical-align: bottom; max-width: 0; animation: type 1.4s steps(26, end) .5s forwards; }
.tag .caret { color: var(--gold); animation: blink 1s steps(1) infinite; }
@keyframes type { to { max-width: 30ch; } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tag .t { animation: none; max-width: none; } }
.foot .short { display: none; }
.snd { font: inherit; color: inherit; text-transform: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
#snd svg { width: 16px; height: 16px; display: block; } #snd[aria-pressed="true"] .off, #snd[aria-pressed="false"] .on { display: none; } #snd[aria-pressed="false"] { color: #9a9a9a; }

.hud { position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); top: 18px; text-align: right; pointer-events: none; z-index: 2; }
.hud .label { text-transform: uppercase; color: var(--muted); }
.hud .n { font-family: var(--serif); font-size: clamp(48px, 6vw, 96px); line-height: .9; letter-spacing: -.03em; font-variant-numeric: tabular-nums lining-nums; transition: transform .12s; transform-origin: 100% 50%; }
.hud .n.bump { transform: scale(1.04); }
.hud .meta { color: var(--muted); text-transform: uppercase; display: flex; gap: 12px; justify-content: end; }
.hud .meta b { color: var(--ink); font-weight: 400; font-variant-numeric: tabular-nums; }
.hud .boost { color: var(--gold); }
.hud .label { display: flex; justify-content: end; align-items: baseline; gap: 8px; }
.hud .mx { font-weight: 400; color: var(--gold); font-variant-numeric: tabular-nums; display: inline-block; transition: transform .1s; }
.hud .mx.hot { color: #e2531b; }
.hud .mx.pop { transform: scale(1.35); }
.hud .n { --len: 9; font-size: calc(clamp(48px, 6vw, 96px) * min(1, 10 / var(--len))); white-space: nowrap; }
.hud .n small { font-size: .55em; letter-spacing: 0; margin-left: .06em; color: var(--gold); }
.hud .fxs { font-weight: 400; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hud .label { min-width: 0; white-space: nowrap; }
@media (min-width: 761px) { #extra { max-width: min(360px, 34vw); margin-left: auto; } }
#extra { flex-wrap: wrap; row-gap: 0; }
#extra span + span::before { content: '· '; color: var(--line); margin-left: -6px; }
.hud .form, .hud .balls { display: none; }
.hud .form { align-items: center; gap: 8px; text-transform: uppercase; color: var(--muted); font-size: 11px; }
.hud .form .fn { color: var(--ink); }
.hud .bar { position: relative; flex: 1 1 60px; min-width: 50px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.hud .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gold); border-radius: 4px; transition: width .4s; }
.hud .balls { gap: 8px; align-items: center; justify-content: center; color: var(--muted); text-transform: uppercase; font-size: 11px; }
.hud .dots { display: inline-flex; gap: 3px; }
.hud .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.hud .dots i.on { background: radial-gradient(circle at 35% 35%, #fff2c0, #ffa63a 55%, #c4561a); }
.toast { position: absolute; left: 50%; top: 9%; transform: translate(-50%, 6px); width: max-content; max-width: 88%; text-align: center; text-wrap: balance; font-family: var(--serif); font-style: italic; font-size: clamp(22px, 2.6vw, 34px); line-height: 1.05; color: var(--ink); -webkit-text-stroke: 6px #fff; paint-order: stroke fill; text-shadow: none; opacity: 0; transition: opacity .3s, transform .6s; pointer-events: none; z-index: 2; }
.wish { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); z-index: 6; display: flex; flex-direction: column; gap: 8px; width: min(320px, 86%); }
.wish[hidden] { display: none; }
.game.wishing .hud, .game.wishing .shop-toggle, .game.wishing .mbtn, .game.wishing .shop, .game.wishing .toast { visibility: hidden; }
body.shen .hud, body.shen .pair, body.shen .mbtn, body.shen .shop, body.shen .brand { visibility: hidden; opacity: 0; transition: opacity .3s, visibility .3s; }   /* hidden for the whole summon, not just while each wish is open */   /* the wish menu owns the screen while it's up */
.wish p { margin: 0 0 4px; text-align: center; font-family: var(--serif); font-style: italic; font-size: 30px; color: var(--ink); -webkit-text-stroke: 6px #fff; paint-order: stroke fill; text-shadow: none; }
.wish button { font: inherit; display: flex; flex-direction: column; align-items: start; gap: 1px; text-align: left; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; cursor: pointer; transition: transform .12s, border-color .15s; }
.wish button:hover, .wish button:focus-visible { border-color: var(--gold); transform: translateY(-1px); outline: none; }
.wish b { font-weight: 400; text-transform: uppercase; }
.wish span { color: var(--muted); }
.wish i { font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.wish .rare { border-color: #8ab4f8; } .wish .rare i { color: #2f6fd6; }
.wish .epic { border-color: #c79af2; background: #fbf6ff; } .wish .epic i { color: #8a3fd1; }
.wish .legendary { border: 2px solid #f0b43a; background: #fffaf0; box-shadow: 0 0 14px rgba(240, 180, 58, .45); } .wish .legendary i { color: #c98a10; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.shop { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; width: min(96%, 900px); z-index: 2; }
.shop button { font: inherit; display: flex; flex-direction: column; align-items: start; gap: 0; text-align: left; color: var(--ink); background: #ffffff; box-shadow: 0 1px 0 rgba(0,0,0,.06); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; cursor: pointer; min-width: 128px; transition: border-color .15s, transform .12s, opacity .2s; }
.shop button:hover:not(:disabled) { border-color: var(--ink); }
.shop button:active:not(:disabled) { transform: translateY(1px); }
.shop button:disabled { color: var(--muted); cursor: not-allowed; }
.shop button:disabled i { color: var(--muted); }
.shop button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.shop b { font-weight: 400; text-transform: uppercase; white-space: nowrap; }
.shop em { font-style: normal; color: var(--gold); font-variant-numeric: tabular-nums; }
.shop button:disabled em { color: var(--muted); }
.shop button.special { border-color: var(--gold); background: #fff8e6; }
.shop span { color: var(--muted); }
.shop i { font-style: normal; color: var(--gold); }
.shop-toggle, .mbtn { display: none; }
.pair { display: contents; }
@media (min-width: 761px) {
  .shop { left: 16px; top: 44px; bottom: 12px; transform: none; width: 236px; flex-direction: column; justify-content: center; gap: 2px; }   /* centred in the space below the hint */
  .shop { pointer-events: none; } .shop button { pointer-events: auto; }   /* the column spans the card's height: only the buttons take taps, so the moon or a pod behind it stays clickable */
  .shop button { width: 100%; min-width: 0; padding: 2px 10px 3px; border-radius: 9px; line-height: 1.25; flex-direction: row; align-items: baseline; justify-content: space-between; gap: 8px; }
  .shop button { flex-wrap: wrap; row-gap: 0; }
  .shop b { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .shop em { flex: none; }
  /* 14 rows: descriptions show on hover, beside the row, instead of taking a line each */
  .shop { flex-wrap: nowrap; }
  .shop button { position: relative; }
  .shop button span { display: none; }
  .shop button:hover span, .shop button:focus-visible span { display: block; position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); width: max-content; max-width: 220px; padding: 4px 9px; font-size: 10px; line-height: 1.3; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); z-index: 6; text-transform: none; }
}
/* before play: the planet idles, the game UI stays hidden */
.game:not(.playing) .hud, .game:not(.playing) .shop, .game:not(.playing) .shop-toggle, .game:not(.playing) .mbtn, .game:not(.playing) .hint, .game:not(.playing) .toast { opacity: 0; visibility: hidden; }
.hud, .shop, .shop-toggle, .mbtn, .hint { transition: opacity .5s, visibility .5s; }
.intro { position: absolute; inset: 0; z-index: 5; pointer-events: none; transition: opacity .45s, visibility .45s; }
.game.playing .intro { opacity: 0; visibility: hidden; }
@keyframes blink { 50% { opacity: 0; } }
/* start screen: blinking press start; clicking anywhere on the game starts it */
.intro { pointer-events: auto; cursor: pointer; }
.start { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 8px; font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; pointer-events: auto; text-transform: uppercase; }
.start:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
.s-arcade span { font-family: "Press Start 2P", var(--mono); font-size: 15px; letter-spacing: .04em; color: #0b0b0b; white-space: nowrap; text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff, 2px 2px #fff, -2px -2px #fff, 2px -2px #fff, -2px 2px #fff; animation: blinkS 1.1s steps(1) infinite; }
.s-arcade i { display: inline-block; font-style: normal; animation: nudgeL .55s steps(2) infinite alternate; }
.s-arcade i.r { animation-name: nudgeR; }
@keyframes nudgeL { to { transform: translateX(4px); } }
@keyframes nudgeR { to { transform: translateX(-4px); } }
@media (max-width: 760px) { .s-arcade span { font-size: 12px; } }
@media (prefers-reduced-motion: reduce) { .s-arcade span, .s-arcade i { animation: none; } }
@keyframes blinkS { 60% { opacity: 0; } }
/* kaioken: a red button once it's bought; it counts down while recharging */
.kaio { position: absolute; right: 18px; bottom: 18px; z-index: 3; font: inherit; text-transform: uppercase; letter-spacing: .06em; color: #fff; background: #e0332b; border: 0; border-radius: 999px; padding: 7px 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(224, 51, 43, .35), inset 0 1px 0 rgba(255,255,255,.3); transition: transform .12s, background .2s; }
.kaio:hover:not(:disabled) { transform: translateY(-1px); }
.kaio:active:not(:disabled) { transform: translateY(1px); }
.kaio:disabled { background: #f1b9b4; box-shadow: none; cursor: default; }
.kaio[hidden], .game:not(.playing) .kaio, .game.wishing .kaio { display: none; }
@media (max-width: 760px) {
  .kaio { position: static; height: 34px; box-sizing: border-box; padding: 0 14px; white-space: nowrap; flex: none; }   /* the cooldown text stays on one line, to the right of upgrades */ .game:has(.shop.open) .kaio { display: none; }
}
/* the current training goal heads the upgrades list */
.goal { display: flex; flex-direction: column; gap: 4px; padding: 2px 4px 6px; color: var(--muted); text-transform: lowercase; font-size: 10px; line-height: 1.3; }
.goal i { position: relative; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.goal b { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gold); border-radius: 3px; transition: width .4s; }
@media (max-width: 760px) { .goal { grid-column: 1 / -1; background: rgba(255,255,255,.94); border-radius: 10px; padding: 6px 10px 8px; } }
.hint { position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); top: 18px; color: var(--muted); text-transform: uppercase; z-index: 2; pointer-events: none; }
.game.buffs .hint, body.snake .hint { opacity: 0; visibility: hidden; }
@media (min-width: 761px) { .hud .label { flex-wrap: wrap; row-gap: 0; max-width: min(540px, 46vw); margin-left: auto; } .hud .fxs { flex: 1 0 100%; white-space: normal; text-align: right; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; } }
/* snake way controls panel: the shop and hud sink under its dim and take no taps while it's up */
.game.howto .shop, .game.howto .hud, .game.howto .pair, .game.howto .mbtn { opacity: .12; pointer-events: none; } .game.howto .shop button { pointer-events: none; }

.foot { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; text-transform: uppercase; color: var(--muted); }
.foot .copy { display: flex; align-items: center; gap: 14px; color: var(--ink); }
.foot nav { display: flex; gap: 16px; flex-wrap: wrap; color: var(--ink); }
body:not(.cv) .foot a.cv { display: none; }   /* the cv link only shows once your power level passes 9,007,199,254,740,991 */

/* card: logo above a framed game panel, links below */
.page { display: flex; flex-direction: column; align-items: center; padding-block: 52px 28px; gap: 18px; }
.brand { width: min(1120px, 96vw); height: clamp(150px, 23vw, 310px); margin-block: -14px calc(-1 * clamp(28px, 4.2vw, 58px)); }
.game { width: min(1200px, calc(100vw - 40px)); height: clamp(460px, 66vh, 760px); border: 1px solid var(--line); border-radius: 28px; background: #fcfcfb; }
.foot { width: min(1200px, calc(100vw - 40px)); padding: 6px 4px; }
@media (max-width: 760px) {
  .page { padding-block: 14px 22px; gap: 10px; }
  .foot { order: 1; width: calc(100vw - 24px); justify-content: center; padding: 0; }
  .foot nav { gap: 14px; justify-content: center; }
  .foot .copy { display: none; }
  .game { order: 2; width: calc(100vw - 24px); height: min(72vh, 620px); border-radius: 20px; }
  .brand { order: 3; width: calc(100vw - 8px); height: 38vw; }
  .hud { top: 12px; right: 14px; }
  .hud .meta { gap: 8px; font-size: 11px; }
  .toast { top: 26%; font-size: 22px; }
  .hint { display: none; }
  .shop-toggle { display: flex; align-items: center; gap: 8px; position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3; font: inherit; text-transform: uppercase; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; box-shadow: 0 1px 0 rgba(0,0,0,.06); cursor: pointer; }
  /* sound and share sit either side of the upgrades pill on phones, instead of in the footer */
  .mbtn { display: grid; place-items: center; position: absolute; bottom: 12px; z-index: 3; width: 34px; height: 34px; padding: 0; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 50%; box-shadow: 0 1px 0 rgba(0,0,0,.06); cursor: pointer; }
  .mbtn svg { width: 18px; height: 18px; } .mbtn.done { color: #1a9a4a; }
  #sndM[aria-pressed="true"] .off, #sndM[aria-pressed="false"] .on { display: none; } #sndM[aria-pressed="false"] { color: #9a9a9a; }
  #sndM { left: 16px; } #shareM { right: 16px; }
  .shop-toggle { position: static; transform: none; height: 34px; box-sizing: border-box; padding-block: 0; white-space: nowrap; flex: none; }
  /* upgrades (and kaioken, once bought) sit as one centred row between the sound and share buttons */
  .pair { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3; display: flex; flex-wrap: nowrap; gap: 8px; width: max-content; }
  .foot .snd { display: none; }
  .shop-toggle i, .tabbar i { font-style: normal; color: #fff; background: var(--gold); border-radius: 999px; padding: 0 6px; min-width: 18px; text-align: center; }
  .shop-toggle i:empty, .tabbar i:empty { display: none; }
  .shop-toggle:focus-visible, .menu-btn:focus-visible, .tabbar button:focus-visible, .mswitch button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .shop { display: none; bottom: 54px; grid-template-columns: 1fr 1fr; gap: 5px; width: calc(100% - 20px); }
  .shop.open { display: grid; }
  .shop button { min-width: 0; padding: 6px 9px; border-radius: 10px; flex-direction: column; gap: 0; }
  .shop b { font-size: 11px; white-space: normal; }
  .shop span { display: block; font-size: 9.5px; line-height: 1.2; }
  .menu-btn, .rule, .tabbar { display: none; }
  /* full-bleed base for every phone variant: the game is the whole screen */
  .page { position: relative; padding: 0; gap: 0; }
  .game { order: 1; width: 100vw; height: 100svh; border: 0; border-radius: 0; }
  .brand { position: absolute; z-index: 3; width: auto; }
  .foot { position: absolute; z-index: 4; width: auto; padding: 0; }
  .foot nav { gap: 12px; }
  .foot nav a, .foot nav span { font-size: 11px; }
  .hud { top: auto; bottom: 66px; right: 14px; background: rgba(255,255,255,.86); border-radius: 12px; padding: 6px 10px; }
  .toast { top: 34%; }
  .wish { right: auto; left: 50%; top: auto; bottom: 70px; transform: translateX(-50%); }
  .wish p { font-size: 24px; }
  .wish button { padding: 7px 12px; }
  /* phones: a thin bar of links on top, the full-screen game, the title on the cloud sea */
  .foot { position: relative; order: 0; height: 40px; width: 100vw; justify-content: center; align-items: center; border-bottom: 1px solid var(--line); background: #fff; }
  /* dvh: the visible height, whichever of safari's bars are out. svh left a strip of page under the game once the bars
     collapsed, and lvh pushed the top of the page under the address bar; the game redraws at once after a resize */
  .game { height: calc(100svh - 40px); height: calc(100dvh - 40px); }
  html, body { background: var(--sea) linear-gradient(#fff 50%, var(--sea) 50%) no-repeat; }
  html { overscroll-behavior: none; touch-action: manipulation; }
  /* iOS 26 Safari tints its bottom bar from the fixed/sticky element at the edge — the near-white sticky page,
     unless this gold strip (hidden under the clouds) sits on top */
  .page.past .edge { display: block; position: fixed; left: 0; right: 0; bottom: -8px; height: 12px; background: var(--sea); z-index: 50; pointer-events: none; }
  .page { background: #fff; }
  .foot .long { display: none; } .foot .short { display: inline; }
  .tag { bottom: -10px; font-size: 11px; }
  .brand { left: 0; right: 0; bottom: max(76px, 14svh); height: 30vw; }
  .hud { top: 6px; bottom: auto; right: 10px; padding: 3px 8px; }
  .hud .n { font-size: calc(36px * min(1, 10 / var(--len))); }
}
/* desktop: title, card and links always fit the window — the card takes whatever height is left */
@media (min-width: 761px) {
  .page { height: 100svh; min-height: 600px; padding-block: 20px 16px; gap: 14px; box-sizing: border-box; }
  .brand { flex: none; height: clamp(130px, min(23vw, 26svh), 310px); }
  .game { flex: 1 1 auto; height: auto; min-height: 380px; max-height: 760px; }
  .foot { flex: none; }
}
/* portrait tablets: the links become a bar on top (as on phones), so the scroll cue sits alone at the bottom
   and the card grows into the height a wide screen doesn't have */
@media (min-width: 761px) and (orientation: portrait) {
  .page { padding-top: 0; }
  .foot { order: -1; width: 100vw; height: 44px; box-sizing: border-box; padding: 0 20px; align-items: center; border-bottom: 1px solid var(--line); }
  .game { max-height: none; }
}
/* scroll intro: the page is pinned for one screen of scrolling; the title starts big in the middle,
   then settles into place as the game card rises in (driven by --p, 0 → 1, from JS) */
.scroller { height: 200svh; }
.scroller > .page { position: sticky; top: 0; overflow: clip; }
@media (max-width: 760px) { .scroller { height: auto; } html, body { overflow: hidden; } }   /* no scroll on phones: the cue plays the intro */
